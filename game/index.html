<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ORBITAL DODGE: AI-assisted satellite conjunction triage on a 3D whole-Earth simulator." />
    <meta name="color-scheme" content="dark" />
    <title>ORBITAL DODGE</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231b1f2a'/%3E%3Ccircle cx='8' cy='8' r='4.2' fill='%237ea6d6'/%3E%3Cellipse cx='8' cy='8' rx='7' ry='2.4' fill='none' stroke='%23ebcb8b' stroke-width='1.2' transform='rotate(-25 8 8)'/%3E%3Ccircle cx='13.2' cy='5.6' r='1.4' fill='%23d06b75'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #12151c; overflow: hidden; }
      #boot { position: fixed; inset: 0; z-index: 300; display: grid; place-items: center; background: #12151c; color: #eceff4;
        font: 600 18px/1.5 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; transition: opacity 0.35s; }
      #boot small { display: block; margin-top: 6px; font-size: 15px; font-weight: 400; color: #a3adbf; }
      #boot.out { opacity: 0; pointer-events: none; }
      #boot .blink { animation: boot-blink 1.2s ease-in-out infinite; }
      @keyframes boot-blink { 50% { opacity: 0.4; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="world"></div>
      <div id="ui"></div>
    </div>
    <div id="boot"><div>ORBITAL DODGE<small class="blink">Connecting to mission control…</small></div></div>
    <noscript><p style="color:#eceff4;font-family:system-ui,sans-serif;padding:20px">ORBITAL DODGE needs JavaScript.</p></noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
