[project]
name = "orbital-dodge"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "pandas",
  "numpy",
  "scipy",
  "scikit-learn",
  "pyarrow",
  "joblib",
  "httpx",
  "anthropic",
  "structlog",
  "orjson",
  "pytest",
  "hypothesis",
  "jsonschema",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
